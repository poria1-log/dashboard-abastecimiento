name: Actualizar Dashboard Central Oeste

on:
  # Corre todos los días a las 8 AM Argentina (11:00 UTC)
  schedule:
    - cron: '0 11 * * *'

  # También permite ejecutarlo manualmente desde GitHub
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests openpyxl PyGithub

      - name: Ejecutar script de actualización
        env:
          KIKKER_TOKEN: ${{ secrets.KIKKER_TOKEN }}
          GH_TOKEN_PAT: ${{ secrets.GH_TOKEN_PAT }}
        run: python actualizar_dashboard.py
